name: nvidia-blackwell-plus
summary: CUDA optimized for NVIDIA Blackwell GPUs or later
description: |
  This engine uses llama.cpp with the CUDA backend, specifically 
  optimized for the NVIDIA Blackwell architecture or later.
  
  This engine supports both amd64 and arm64 CPU architectures.
vendor: Canonical Ltd
devices:
  allof:
    - type: gpu
      vendor-id: 0x10de # Nvidia Corporation
      compute-capability: ">=10.0" # Blackwell or later
  anyof:
    - type: cpu
      architecture: amd64
    - type: cpu
      architecture: arm64
runtime: llamacpp-cuda
model:
  default: nemotron-3.5-super-vl-nvfp4
  options:
    - nemotron-3.5-super-vl-nvfp4
configurations:
  sleep-idle-seconds: 600
  min-context-size: 4096
  draft-min: 0
  draft-max: 3
