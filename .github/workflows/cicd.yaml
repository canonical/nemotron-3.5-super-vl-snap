# This workflow is triggered when a push is made to the main branch or when manually triggered.
# To skip a run on push, add [skip ci] to the commit message.
name: CICD

on:
  push:
    branches:
      - main
  
  workflow_dispatch: # manual trigger 


# Keep one CICD run active at a time so publish/test/promote happen in order
concurrency:
  group: ${{ github.workflow }}
  queue: max

jobs:
  cicd:
    if: github.repository == 'canonical/nemotron-3.5-super-vl-snap' # do not run on forks
    uses: canonical/inference-snaps-dev/.github/workflows/reuse-cicd.yaml@configurable-timeouts
    with:
      build-runner: |
        [
          ["amd64", "2xlarge-extra", "noble", "self-hosted"],
          ["arm64", "large-extra", "noble", "self-hosted"]
        ]
      timeout-minutes: 600
      store-track: latest
      snap-name: nemotron-3-5-super-vl
      smoke-test-engine: cpu
      smoke-test-runner: |
        [
          ["amd64", "2xlarge-extra", "noble", "self-hosted"],
          ["arm64", "large-extra", "noble", "self-hosted"]
        ]
    secrets:
      store-credentials: ${{ secrets.STORE_LOGIN_MAIN }}
