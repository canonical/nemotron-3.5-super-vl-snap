name: nemotron-3-5-super-vl
title: Nemotron 3.5 Super VL
summary: Local AI with Nemotron 3.5 Super VL inference snap
description: |
  Nemotron 3.5 Super VL is a vision language model trained by NVIDIA with 120B (12B active) parameters.

  Use this snap to quickly install an optimized environment for local inference with Nemotron 3.5 Super VL.

  The snap includes the following hardware-optimized inference engines:

  * cpu: Optimized for x64 and ARM (armv8, armv9) CPUs
  * nvidia-gpu: CUDA-enabled GPU acceleration

  The most suitable engine is automatically selected based on the available hardware.

  **Install:**

  `sudo snap install nemotron-3-5-super-vl`

  **Run:**

  `nemotron-3-5-super-vl`

  Some accelerators require extra drivers to be usable with this snap:
  https://documentation.ubuntu.com/inference-snaps/how-to/setup/drivers/

  **License:**

  The Nemotron 3.5 Super VL model is provided by NVIDIA under the NVIDIA Open Model License:
  https://www.nvidia.com/en-us/agreements/enterprise-software/nvidia-open-model-license/ 

  The licenses of all the bundled software can be found after installing the snap at
  `/snap/nemotron-3-5-super-vl/current/usr/share/doc`.

website: https://documentation.ubuntu.com/inference-snaps
source-code: https://github.com/canonical/n35s-snap
issues: https://github.com/canonical/inference-snaps/issues

adopt-info: version

base: core24
grade: stable
confinement: strict
compression: lzo

assumes:
  - snapd2.68

platforms:
  amd64:
  arm64:

environment:
  SNAP_COMPONENTS: /snap/$SNAP_INSTANCE_NAME/components/$SNAP_REVISION
  ARCH_TRIPLET: $CRAFT_ARCH_TRIPLET_BUILD_FOR

slots:
  provider:
    interface: content
    content: inference-provider
    source:
      read:
        - $SNAP_COMMON/share/provider

plugs:
 # To allow sideloading models by root
 home:
   read: all

hooks:
  install:
    plugs: &install-plugs
      - hardware-observe
      - opengl
  post-refresh:
    plugs: *install-plugs

apps:
  nemotron-3-5-super-vl:
    command: bin/modelctl
    completer: bin/snap-completer.bash
    plugs:
      - hardware-observe
      - opengl
      - network
      - desktop # To open the webui in the browser
    environment:
      ADDITIONAL_FEATURES: chat, webui

  server:
    command: bin/server.sh
    daemon: simple
    plugs:
      - network-bind
      - hardware-observe
      - opengl
      - home

  server-webui:
    command: bin/server-webui.sh
    daemon: simple
    plugs:
      - network-bind

parts:
  cli:
    source:
      - on amd64: https://github.com/canonical/inference-snaps-cli/releases/download/v2.0.0-beta.17/inference-snaps-cli-linux-amd64.tar.xz
      - on arm64: https://github.com/canonical/inference-snaps-cli/releases/download/v2.0.0-beta.17/inference-snaps-cli-linux-arm64.tar.xz
    plugin: dump
    override-build: |

      # For tab completion
      ln --symbolic ./modelctl bin/nemotron-3-5-super-vl

      craftctl default

  cli-lscpi:
    plugin: nil
    stage-packages:
      - pciutils

  cli-nvidia-smi:
    plugin: nil
    stage-packages:
      - nvidia-utils-595
    stage:
      - usr/bin/nvidia-smi
      - usr/share/doc/nvidia-utils-595

  version:
    after: [cli]
    plugin: nil
    source: . # To regenerate the git hash on every change
    build-packages:
      - jq
      - git
    override-pull: |
      # Do nothing. This significantly reduces build time when sourcing large files.
    override-build: |
      set -eo pipefail
      cli_version=$($CRAFT_STAGE/bin/modelctl version --format=json | jq .cli --raw-output)
      git_hash=$(git -C "$SNAPCRAFT_PROJECT_DIR" describe --always)
      craftctl set version="${cli_version#v}+${git_hash}"

  webui:
    plugin: dump
    source: https://github.com/canonical/inference-snaps-webui/releases/download/v1.1.0/inference-snaps-webui.tar.xz
    organize:
      "*": webui/

  engines:
    source: engines
    plugin: dump
    organize:
      "*": engines/

  models:
    source: models
    plugin: dump
    organize:
      "*": models/

  runtimes:
    source: runtimes
    plugin: dump
    organize:
      "*": runtimes/

  scripts:
    source: scripts
    plugin: dump
    stage-packages:
      - jq
    organize:
      "server.sh": bin/
      "engine-server.sh": bin/
      "server-webui.sh": bin/

  llamacpp:
    plugin: dump
    source:
      - on amd64: https://github.com/canonical/llama.cpp-builds/releases/download/b11100/llamacpp-amd64.tar.gz
      - on arm64: https://github.com/canonical/llama.cpp-builds/releases/download/b11100/llamacpp-arm64.tar.gz
    override-build: |
      # Move license files to be included in the snap, not the component
      mkdir -p $CRAFT_PRIME/usr/share/doc/
      mv licenses $CRAFT_PRIME/usr/share/doc/llama.cpp

      craftctl default
    stage-packages:
      - libgomp1
    organize:
      # move everything, including the staged packages
      "*": (component/llamacpp)

  llamacpp-cuda:
    plugin: dump
    source:
      - on amd64: https://github.com/canonical/llama.cpp-builds/releases/download/b11100/llamacpp-amd64+cuda12.9.tar.gz
      - on arm64: https://github.com/canonical/llama.cpp-builds/releases/download/b11100/llamacpp-arm64+cuda12.9.tar.gz
    override-build: |
      # Move license files to be included in the snap, not the component
      mkdir -p $CRAFT_PRIME/usr/share/doc/
      mv licenses $CRAFT_PRIME/usr/share/doc/llama.cpp-cuda

      craftctl default
    stage-packages:
      - libgomp1
    organize:
      "*": (component/llamacpp-cuda)

  model-weights:
    plugin: nil
    source: model-weights
    override-build: |
      cp -rf --archive --link --no-dereference ${CRAFT_PART_SRC}/* ${CRAFT_PART_INSTALL}
    organize:
      "Q4_K_M/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-Q4_K_M-00001-of-00020.gguf": (component/q4-k-m-01-of-20)/
      "Q4_K_M/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-Q4_K_M-00002-of-00020.gguf": (component/q4-k-m-02-of-20)/
      "Q4_K_M/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-Q4_K_M-00003-of-00020.gguf": (component/q4-k-m-03-of-20)/
      "Q4_K_M/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-Q4_K_M-00004-of-00020.gguf": (component/q4-k-m-04-of-20)/
      "Q4_K_M/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-Q4_K_M-00005-of-00020.gguf": (component/q4-k-m-05-of-20)/
      "Q4_K_M/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-Q4_K_M-00006-of-00020.gguf": (component/q4-k-m-06-of-20)/
      "Q4_K_M/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-Q4_K_M-00007-of-00020.gguf": (component/q4-k-m-07-of-20)/
      "Q4_K_M/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-Q4_K_M-00008-of-00020.gguf": (component/q4-k-m-08-of-20)/
      "Q4_K_M/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-Q4_K_M-00009-of-00020.gguf": (component/q4-k-m-09-of-20)/
      "Q4_K_M/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-Q4_K_M-00010-of-00020.gguf": (component/q4-k-m-10-of-20)/
      "Q4_K_M/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-Q4_K_M-00011-of-00020.gguf": (component/q4-k-m-11-of-20)/
      "Q4_K_M/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-Q4_K_M-00012-of-00020.gguf": (component/q4-k-m-12-of-20)/
      "Q4_K_M/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-Q4_K_M-00013-of-00020.gguf": (component/q4-k-m-13-of-20)/
      "Q4_K_M/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-Q4_K_M-00014-of-00020.gguf": (component/q4-k-m-14-of-20)/
      "Q4_K_M/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-Q4_K_M-00015-of-00020.gguf": (component/q4-k-m-15-of-20)/
      "Q4_K_M/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-Q4_K_M-00016-of-00020.gguf": (component/q4-k-m-16-of-20)/
      "Q4_K_M/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-Q4_K_M-00017-of-00020.gguf": (component/q4-k-m-17-of-20)/
      "Q4_K_M/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-Q4_K_M-00018-of-00020.gguf": (component/q4-k-m-18-of-20)/
      "Q4_K_M/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-Q4_K_M-00019-of-00020.gguf": (component/q4-k-m-19-of-20)/
      "Q4_K_M/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-Q4_K_M-00020-of-00020.gguf": (component/q4-k-m-20-of-20)/
      "mmproj-BF16/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-mmproj-BF16.gguf": (component/mmproj-bf16)/
    prime:
      - -*   # exclude everything not explicitly organized

  notice:
    plugin: nil
    source: NOTICE
    source-type: file
    override-build: |
      license_dir=$CRAFT_PART_INSTALL/usr/share/doc
      mkdir -p $license_dir
      cp NOTICE $license_dir/
      cp $SNAPCRAFT_PROJECT_DIR/LICENSE $license_dir/
      cp $SNAPCRAFT_PROJECT_DIR/NVIDIA-Nemotron-Open-Model-License-12-12-25.pdf $license_dir/

components:
  q4-k-m-01-of-20: &model-component
    type: standard
    summary: Q4_K_M GGUF model
    description: |
      Nemotron 3.5 Super VL Q4_K_M GGUF model weights split into 5G parts.
      All 20 parts are required to run the model.
  q4-k-m-02-of-20:
    <<: *model-component
  q4-k-m-03-of-20:
    <<: *model-component
  q4-k-m-04-of-20:
    <<: *model-component
  q4-k-m-05-of-20:
    <<: *model-component
  q4-k-m-06-of-20:
    <<: *model-component
  q4-k-m-07-of-20:
    <<: *model-component
  q4-k-m-08-of-20:
    <<: *model-component
  q4-k-m-09-of-20:
    <<: *model-component
  q4-k-m-10-of-20:
    <<: *model-component
  q4-k-m-11-of-20:
    <<: *model-component
  q4-k-m-12-of-20:
    <<: *model-component
  q4-k-m-13-of-20:
    <<: *model-component
  q4-k-m-14-of-20:
    <<: *model-component
  q4-k-m-15-of-20:
    <<: *model-component
  q4-k-m-16-of-20:
    <<: *model-component
  q4-k-m-17-of-20:
    <<: *model-component
  q4-k-m-18-of-20:
    <<: *model-component
  q4-k-m-19-of-20:
    <<: *model-component
  q4-k-m-20-of-20:
    <<: *model-component
  mmproj-bf16:
    type: standard
    summary: Multimodal Projector in BF16
    description: Nemotron 3.5 Super VL Multimodal Projector component.
  llamacpp:
    type: standard
    summary: llama.cpp CPU runtime
    description: llama.cpp inference runtime optimized for CPUs.
  llamacpp-cuda:
    type: standard
    summary: llama.cpp CUDA runtime
    description: llama.cpp inference runtime with CUDA acceleration for NVIDIA GPUs.

lint:
  ignore:
    - metadata:
      - license
      - contact
